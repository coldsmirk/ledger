name: CI

# Quality gate for pushes to main and every pull request to main: typecheck, lint, test, build,
# and published-package validation across all packages. (PR branches are covered by the
# pull_request trigger alone, so a branch push does not double-run.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check && pnpm lint:css:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate published package shape
        run: pnpm check:package
